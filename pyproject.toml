[project]
name = "heimerdinger"
version = "0.1.0"
description = "League of Legends coaching platform: ingest, reports, embeddings and coaching."
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.27",
    "pymongo==4.4.0",
    "python-dotenv==1.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2.2",
    "chromadb>=1.0.0",
]
tui = [
    "textual>=0.60.0",
    "rich>=13.3.4",
    "plotext>=5.2.0",
]
dev = [
    "pytest==7.4.0",
    "pytest-asyncio==0.22.0",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated and slated for removal in Python 3.16.*:DeprecationWarning:pytest_asyncio.plugin",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]
